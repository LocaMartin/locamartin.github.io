<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Death Dashboard</title>

  <!-- Core styles -->
  <link rel="stylesheet" href="res/css/index.css">
  <link rel="stylesheet" href="res/css/sidebar.css">

  <!-- Module styles (one per module: delete a line to detach) -->
  <link rel="stylesheet" href="res/css/templates/home.css">
  <link rel="stylesheet" href="res/css/templates/death.css">
  <link rel="stylesheet" href="res/css/templates/recon.css">
  <link rel="stylesheet" href="res/css/templates/analytics.css">
  <link rel="stylesheet" href="res/css/templates/notes.css">
  <link rel="stylesheet" href="res/css/templates/portfolio.css">

  <!-- Vendor -->
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js" defer></script>

  <!-- Core scripts (order matters) -->
  <script src="res/js/core/core.js" defer></script>
  <script src="res/js/sidebar.js" defer></script>

  <!-- Modules: each file registers itself with ModuleRegistry (delete a line to detach) -->
  <script src="res/js/templates/home.js" defer></script>
  <script src="res/js/templates/death.js" defer></script>
  <script src="res/js/templates/recon.js" defer></script>
  <script src="res/js/templates/analytics.js" defer></script>
  <script src="res/js/templates/notes.js" defer></script>
  <script src="res/js/templates/portfolio.js" defer></script>

  <!-- Which modules are enabled + order, then auth (kicks everything off) -->
  <script src="res/js/sidebar-config.js" defer></script>
  <script src="res/js/core/auth.js" defer></script>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="lock">
      <svg viewBox="0 0 237.933 237.933" fill="currentColor" width="64" height="64">
        <path d="M233.158,23.945c-0.144-0.248-3.922-7.695-24.301-15.826C195.925,2.959,181.005,0,167.922,0c-13.595,0-24.628,3.053-32.796,9.072c-1.143,0.844-1.623,1.859-1.315,2.789c0.477,1.449,2.319,1.449,2.926,1.449c0.118,0,0.245-0.002,0.378-0.006c1.11-0.037,2.239-0.057,3.348-0.055c31.895,0.039,49.403,5.83,66.054,25.463l-39.881,68.203c-16.648-29.959-51.969-17.672-38.25-65.771c2.269-7.957,1.705-28.121-16.678-32.4c-0.096-0.027-1.904-0.365-2.004-0.373C91.617,4.998,83.844,25.133,82.545,33.303c-7.699,48.462-41.898,18.091-70.254,56.155c-28.354,38.065,27.8,26.836,32.494,79.108c2.029,34.263-6.596,37.842-10.865,54.029c-8.533,32.357,51.989,11.143,78.871-41.395c6.959-14.154,16.193-21.283,25.363-25.576l-27.277,46.648c-0.18,0.229-0.287,0.518-0.287,0.829c0,0.744,0.604,1.349,1.348,1.349h13.355c0.447,0,0.865-0.224,1.116-0.594c2.558-3.787,16.147-28.49,30.687-54.695c11.988-3.633,19.837-7.73,15.177-27.225c9.928-17.687,18.552-32.698,22.246-38.06c7.65-11.102,14.258-20.689,16.608-24.162c6.844-10.105,22.119-33.791,22.271-34.029C233.767,25.128,233.594,24.704,233.158,23.945z"/>
      </svg>
    </div>
    <h1>Death</h1>
    <p>Enter your username and password to continue</p>
    <form id="login-form" method="post" action="#" autocomplete="on">
      <label class="auth-label" for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      
      <label class="auth-label" for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <span class="password-divider"></span>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button class="login-submit" type="submit">Sign in</button>
      <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- App -->
<div id="app">
  <nav>
    <span class="logo"><a href="/">LOCAMARTIN</a></span>

    <div class="nav-center" id="nav-center">
      <a href="/" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <!-- module pills are injected here by sidebar.js -->
    </div>

    <div class="nav-right">
      <button class="menu-btn" id="menu-toggle" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="menu-btn" id="logout-btn" title="Logout" aria-label="Logout">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </nav>

  <div class="main-content">
    <div class="welcome-card">
      <h2>Internal Operations Control</h2>
      <p>Open the menu to inspect metrics, check live recon logs, or use your scratchpad.</p>
    </div>
  </div>
</div>

<!-- Sidebar shell (contents are generated from the enabled modules) -->
<div id="overlay"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <h2>Control Panel</h2>
    <button class="close-btn" id="sidebar-close" aria-label="Close menu">✕</button>
  </div>
  <div class="sidebar-nav" id="sidebar-nav-items"></div>
  <div class="sidebar-body" id="sidebar-panels"></div>
</aside>

<!-- Fullscreen panels (generated) -->
<div id="fullpage-containers"></div>

</body>
</html>
